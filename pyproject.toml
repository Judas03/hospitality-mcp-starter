[project]
name = "hospitality-mcp-starter"
version = "0.1.0"
description = "Starter for an Alexa+ hospitality reservation MCP"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0"
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
