[project]
name = "hospitality-mcp-starter"
version = "0.1.0"
description = "Starter for an Alexa+ hospitality reservation MCP"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2.3.0,<3.0.0",
  "starlette>=0.48.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0"
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.0.0,<10.0.0",
  "pytest-asyncio>=0.23.0,<2.0.0"
]
